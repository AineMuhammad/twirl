# Local development services. Start with: docker compose up -d
# Production uses Neon; this Postgres is only for local development and tests.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: twirl
      POSTGRES_PASSWORD: twirl
      POSTGRES_DB: twirl
    ports:
      - '5433:5432'
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U twirl']
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  db-data:
